<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('radar-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
  const productById = (id) => DATA.products[id] || DATA.products[String(id)];
  const companyById = (id) => DATA.companies[id] || DATA.companies[String(id)];
  const TODAY_PRODUCT_IDS = new Set(
    Object.values(DATA.today_items).filter((it) => it.product_id).map((it) => String(it.product_id))
  );
  let activeTab = 1;

  const nodeName = (id) => {
    for (const track of DATA.tracks) {
      const node = track.nodes.find((n) => n.id === id);
      if (node) return `${node.id} ${node.name}`;
    }
    return id;
  };
  const nodeSort = (id) => {
    const m = String(id || '').match(/^(\d+)-(\d+)$/);
    return m ? [Number(m[1]), Number(m[2])] : [99, 99];
  };

  function renderMeta() {
    const s = DATA.stats;
    const note = DATA.is_today ? '' : ` ｜ 今日暂无更新，显示 ${DATA.data_date}`;
    $('meta').textContent = `生成 ${DATA.generated} ｜ 数据日 ${DATA.data_date} ｜ 赛道 ${s.tracks} ｜ 公司 ${s.companies} ｜ 产品 ${s.products} ｜ 环节 ${s.nodes} ｜ 链接 ${s.links_up}/${s.links} 通${note}`;
    const cells = [
      ['公司', s.companies], ['产品', s.products], [DATA.is_today ? '今日条目' : '最近更新', s.today_items],
      ['自动入库', s.auto_products], ['赛道 / 环节', `${s.tracks} / ${s.nodes}`], ['不通链接', s.links_down]
    ];
    $('stats').innerHTML = cells.map(([label, value]) => `<div class="stat"><b>${esc(value)}</b>${esc(label)}</div>`).join('');
  }

  function renderTabs() {
    const tabs = DATA.tracks.map((t) =>
      `<button class="tab${String(activeTab) === String(t.id) ? ' active' : ''}" data-tab="${t.id}">${t.id}. ${esc(t.name)}</button>`
    ).join('');
    $('tabs').innerHTML = tabs +
      `<button class="tab${activeTab === 'today' ? ' active' : ''}" data-tab="today">${DATA.is_today ? '今日更新' : '最近更新'} ${DATA.stats.today_items}</button>` +
      `<button class="tab${activeTab === 'candidates' ? ' active' : ''}" data-tab="candidates">公司发现 ${DATA.stats.candidate_count || 0}</button>`;
  }

  function productRow(p, compact = false) {
    const c = companyById(p.company_id);
    const today = TODAY_PRODUCT_IDS.has(String(p.id));
    const sub = compact
      ? (p.category || '')
      : `${c ? c.name : p.company_name}${p.category ? ' · ' + esc(p.category) : ''}`;
    return `<button class="row product-row" data-product="${p.id}">
      <span class="row-main"><span class="row-title">${esc(p.name)}</span>
      <span class="row-sub">${esc(sub)}</span></span>
      <span class="row-side">${p.origin === 'llm' ? '<span class="tag auto">自动</span>' : ''}${p.heat ? `<span class="tag heat">${esc(p.heat)}</span>` : ''}${today ? '<span class="tag today">今</span>' : ''}</span>
    </button>`;
  }

  function companyRow(c) {
    return `<button class="row company-row" data-company="${c.id}">
      <span class="row-main"><span class="row-title">${esc(c.name)}</span>
      <span class="row-sub">${esc(c.type || '')} · ${esc(c.region || '')} · ${c.product_count} 个产品</span></span>
      <span class="row-side"><span class="tag">${esc((c.track_names || []).join(' / '))}</span></span>
    </button>`;
  }

  function todayItem(it) {
    const product = it.product_id
      ? `<button class="link" data-product="${it.product_id}">${esc(it.product_label || '产品')}</button>`
      : (it.product_label ? `<span class="suggest">${esc(it.product_label)}</span>` : '');
    return `<div class="today-item">
      <div class="today-top"><span class="tag type">${esc(it.update_type || '其他')}</span><strong>${esc(it.title || '')}</strong></div>
      <div class="today-sum">${esc(it.summary || '')}</div>
      <div class="today-meta"><button class="link" data-company="${it.company_id}">${esc(it.company_name)}</button>${product ? ' · ' + product : ''} · 置信度 ${it.confidence ?? '—'}${it.source_url ? ` · <a href="${esc(it.source_url)}" target="_blank" rel="noopener">原文</a>` : ''}</div>
    </div>`;
  }

  function nodeCard(n) {
    const products = n.product_ids.map(productById).filter(Boolean);
    const companies = n.company_ids.map(companyById).filter(Boolean);
    const items = n.today_item_ids.map((id) => DATA.today_items[id]).filter(Boolean);
    return `<article class="node-card">
      <div class="node-head">
        <div class="node-title"><h3>${esc(n.id)} ${esc(n.name)}</h3><p>${esc(n.definition)}</p></div>
        <div class="node-badges"><span class="badge">产品 ${products.length}</span><span class="badge">公司 ${companies.length}</span>
        ${items.length ? `<button class="today-toggle" data-toggle="today-${n.id}">今日 ${items.length}</button>` : ''}</div>
      </div>
      <div class="node-cols">
        <div class="col"><h4>产品</h4><div class="list">${products.length ? products.map(productRow).join('') : '<div class="empty">暂无产品</div>'}</div></div>
        <div class="col"><h4>公司</h4><div class="list">${companies.length ? companies.map(companyRow).join('') : '<div class="empty">暂无公司</div>'}</div></div>
      </div>
      ${items.length ? `<div class="today-panel" id="today-${n.id}" hidden>${items.map(todayItem).join('')}</div>` : ''}
    </article>`;
  }

  function renderTrack(id) {
    const t = DATA.tracks.find((x) => String(x.id) === String(id));
    if (!t) return;
    $('main').innerHTML = `<section class="track-panel">
      <div class="track-head">
        <div><h2>${t.id}. ${esc(t.name)}</h2><p>${esc(t.focus)}</p></div>
        <div class="track-stats"><span>公司 <b>${t.company_count}</b></span><span>产品 <b>${t.product_count}</b></span><span>今日 <b>${t.today_count}</b></span></div>
      </div>
      <div class="nodes">${t.nodes.map(nodeCard).join('')}</div>
    </section>`;
  }

  function renderToday() {
    const items = Object.values(DATA.today_items);
    const groups = new Map();
    for (const it of items) {
      const key = `${it.track_id}. ${it.track_name || ''} / ${it.node_id || ''} ${it.node_name || ''}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    let html = `<section class="track-panel"><div class="track-head"><div><h2>${DATA.is_today ? '今日更新' : '最近更新（' + DATA.data_date + '）'}</h2>
      <p>${items.length} 条细则，来自 ${DATA.stats.today_pages} 个页面</p></div></div>`;
    if (!items.length) html += '<div class="empty">今日暂无更新</div>';
    for (const [key, arr] of groups) {
      html += `<div class="today-group"><h3>${esc(key)}</h3>${arr.map(todayItem).join('')}</div>`;
    }
    $('main').innerHTML = html + '</section>';
  }

  function candidateItem(c) {
    const official = c.official_url
      ? ` · <a href="${esc(c.official_url)}" target="_blank" rel="noopener">官网</a>` : ' · 官网待核';
    const evidence = (c.evidence || []).map((x, i) =>
      `<a href="${esc(x.url)}" title="${esc(x.title || '报道')}" target="_blank" rel="noopener">报道${i + 1}</a>`
    ).join(' · ');
    const profile = [c.region, c.type, c.founded ? `成立 ${c.founded}` : null].filter(Boolean).join(' · ') || '资料待核';
    return `<div class="today-item">
      <div class="today-top"><span class="tag suggest">候选 #${c.id}</span><strong>${esc(c.name)}</strong>
        <span class="tag">置信度 ${c.confidence ?? '—'}</span></div>
      <div class="today-sum">${esc(c.reason || c.moat || '')}</div>
      ${c.moat && c.reason ? `<div class="today-sum">产品特点：${esc(c.moat)}</div>` : ''}
      <div class="today-meta">${esc(profile)} · ${esc(c.node_id || '')} ${esc(c.node_name || '环节待核')}${official}${evidence ? ' · ' + evidence : ''}</div>
    </div>`;
  }

  function renderCandidates() {
    const items = DATA.candidates || [];
    let html = `<section class="track-panel"><div class="track-head"><div><h2>公司发现</h2>
      <p>${items.length} 家待审核候选；自动发现不改正式公司名单，审核通过后再收录和建档。</p></div></div>`;
    if (!items.length) html += '<div class="empty">暂无待审核候选。每周运行公司发现任务后在这里查看。</div>';
    for (const track of DATA.tracks) {
      const arr = items.filter((c) => String(c.track_id) === String(track.id));
      if (!arr.length) continue;
      html += `<div class="today-group"><h3>${track.id}. ${esc(track.name)}（${arr.length}）</h3>
        <article class="node-card"><div class="today-panel">${arr.map(candidateItem).join('')}</div></article></div>`;
    }
    html += '<p class="muted">审核命令：<code>python3 .agent/skills/company-discovery/review.py list</code>；详情用 <code>show 候选ID</code>。</p>';
    $('main').innerHTML = html + '</section>';
  }

  function renderSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) { selectTab(activeTab); return; }
    const companies = Object.values(DATA.companies).filter((c) =>
      [c.name, c.moat, ...(c.track_names || []), ...(c.node_ids || [])].join(' ').toLowerCase().includes(q)
    ).slice(0, 30);
    const products = Object.values(DATA.products).filter((p) =>
      [p.name, p.company_name, p.category, p.description, p.node_name, p.track_name].join(' ').toLowerCase().includes(q)
    ).slice(0, 60);
    $('main').innerHTML = `<section class="track-panel"><h2>搜索：${esc(query)}</h2>
      <div class="search-block"><h3>公司 <span class="muted">${companies.length}${companies.length === 30 ? '+' : ''}</span></h3>
        <div class="list">${companies.length ? companies.map(companyRow).join('') : '<div class="empty">无匹配公司</div>'}</div></div>
      <div class="search-block"><h3>产品 <span class="muted">${products.length}${products.length === 60 ? '+' : ''}</span></h3>
        <div class="list">${products.length ? products.map(productRow).join('') : '<div class="empty">无匹配产品</div>'}</div></div>
    </section>`;
  }

  function selectTab(id) {
    activeTab = id;
    renderTabs();
    if (id === 'today') renderToday();
    else if (id === 'candidates') renderCandidates();
    else renderTrack(id);
  }

  function setHash(hash, push) {
    if (!push) return;
    try { history.pushState(null, '', hash); } catch (e) { location.hash = hash; }
  }

  function openProduct(id, push = true) {
    const p = productById(id);
    if (!p) return;
    activeTab = p.track_id;
    renderTabs();
    renderTrack(activeTab);
    $('drawer').innerHTML = drawerProduct(p);
    $('drawer').hidden = false;
    $('mask').hidden = false;
    document.body.classList.add('drawer-open');
    if (push) setHash('#product/' + p.id, true);
  }

  function openCompany(id, push = true) {
    const c = companyById(id);
    if (!c) return;
    if (c.track_ids && c.track_ids.length) {
      activeTab = c.track_ids[0];
      renderTabs();
      renderTrack(activeTab);
    }
    $('drawer').innerHTML = drawerCompany(c);
    $('drawer').hidden = false;
    $('mask').hidden = false;
    document.body.classList.add('drawer-open');
    if (push) setHash('#company/' + c.id, true);
  }

  function closeDrawer(push = true) {
    $('drawer').hidden = true;
    $('mask').hidden = true;
    document.body.classList.remove('drawer-open');
    if (push) {
      try { history.pushState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    }
  }

  function drawerProduct(p) {
    const c = companyById(p.company_id) || {};
    const release = (p.release_links || []).map((x) =>
      `<li><span class="muted">${esc(x.date || '')}</span> <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a></li>`
    ).join('');
    const pages = (c.product_pages || []).map((x) =>
      `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a> <span class="muted">${esc(x.status || '')}</span></li>`
    ).join('');
    return `<div class="drawer-head"><button class="close" data-close aria-label="关闭">×</button>
      <h2>${esc(p.name)}</h2>
      <div class="sub">${c.id ? `<button class="link" data-company="${c.id}">${esc(c.name)}</button>` : esc(p.company_name)} · ${esc(p.track_name || '')} / ${esc(p.node_name || '')}</div></div>
      <div class="drawer-body">
        <div class="meta-grid">
          <div><span>公司</span><strong>${esc(c.name || p.company_name)}</strong></div>
          <div><span>赛道</span><strong>${esc(p.track_name || '—')}</strong></div>
          <div><span>环节</span><strong>${esc(p.node_name || '—')}</strong></div>
          <div><span>公司内类别</span><strong>${esc(p.category || '—')}</strong></div>
          <div><span>首次出现</span><strong>${esc(p.first_seen || '—')}</strong></div>
          <div><span>热度</span><strong>${esc(p.heat || '—')}</strong></div>
        </div>
        <h3>产品简介</h3><p class="desc">${esc(p.description || '暂无简介')}</p>
        ${p.related ? `<h3>关联产品</h3><p class="desc">${esc(p.related)}</p>` : ''}
        <h3>产品发布 / 动态</h3>
        ${release ? `<ul class="links">${release}</ul>` : '<p class="muted">暂无发布链接，可查看公司产品页或完整档案。</p>'}
        ${pages ? `<h4>公司产品页</h4><ul class="links">${pages}</ul>` : ''}
        <h3>公司与档案</h3>
        ${c.id ? `<p><button class="pill" data-company="${c.id}">查看 ${esc(c.name)} 的全部 ${c.product_count || 0} 个产品</button></p>` : ''}
        ${p.doc ? `<p><a href="${esc(p.doc)}" target="_blank" rel="noopener">打开公司完整档案</a></p>` : ''}
      </div>`;
  }

  function drawerCompany(c) {
    const products = (c.product_ids || []).map(productById).filter(Boolean);
    const groups = new Map();
    for (const p of products) {
      const key = p.node_id || '—';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    const entries = [...groups.entries()].sort((a, b) => {
      const ma = nodeSort(a[0]), mb = nodeSort(b[0]);
      return ma[0] - mb[0] || ma[1] - mb[1];
    });
    let productBlocks = '';
    for (const [nid, arr] of entries) {
      const label = `${nid} ${arr[0].node_name || '其他'}`;
      productBlocks += `<h4>${esc(label)} <span class="muted">${arr.length}</span></h4><div class="list">${arr.map((p) => productRow(p, true)).join('')}</div>`;
    }
    const links = (c.links || []).map((l) =>
      `<li><span class="tag">${esc(l.kind)}</span> <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a> <span class="muted">${esc(l.status || '')}</span></li>`
    ).join('');
    const items = Object.values(DATA.today_items).filter((it) => String(it.company_id) === String(c.id));
    return `<div class="drawer-head"><button class="close" data-close aria-label="关闭">×</button>
      <h2>${esc(c.name)}</h2>
      <div class="sub">${esc(c.type || '')} · ${esc(c.region || '')} · 成立 ${esc(c.founded || '—')} · ${c.product_count} 个产品</div></div>
      <div class="drawer-body">
        <div class="meta-grid">
          <div><span>赛道</span><strong>${esc((c.track_names || []).join(' / '))}</strong></div>
          <div><span>环节</span><strong>${esc((c.node_ids || []).map(nodeName).join('、'))}</strong></div>
          <div><span>最新更新</span><strong>${esc(c.latest_update || '—')}</strong></div>
          <div><span>档案版本</span><strong>${esc(c.doc_version || '—')}</strong></div>
        </div>
        <h3>护城河</h3><p class="desc">${esc(c.moat || '暂无')}</p>
        <h3>产品（${products.length}）</h3>
        ${productBlocks || '<p class="muted">暂无产品</p>'}
        ${items.length ? `<h3>今日更新（${items.length}）</h3>${items.map(todayItem).join('')}` : ''}
        <h3>链接</h3>
        ${links ? `<ul class="links">${links}</ul>` : '<p class="muted">暂无链接</p>'}
        ${c.doc ? `<p><a href="${esc(c.doc)}" target="_blank" rel="noopener">打开完整档案</a></p>` : ''}
      </div>`;
  }

  function route() {
    const hash = location.hash;
    if (hash.startsWith('#product/')) openProduct(hash.slice(9), false);
    else if (hash.startsWith('#company/')) openCompany(hash.slice(9), false);
    else closeDrawer(false);
  }

  $('tabs').addEventListener('click', (e) => {
    const button = e.target.closest('[data-tab]');
    if (!button) return;
    $('search').value = '';
    const tab = button.dataset.tab;
    selectTab(['today', 'candidates'].includes(tab) ? tab : Number(tab));
  });

  $('search').addEventListener('input', (e) => {
    const query = e.target.value;
    if (query.trim()) renderSearch(query); else selectTab(activeTab);
  });

  $('main').addEventListener('click', (e) => {
    const product = e.target.closest('[data-product]');
    if (product) { openProduct(product.dataset.product); return; }
    const company = e.target.closest('[data-company]');
    if (company) { openCompany(company.dataset.company); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const panel = document.getElementById(toggle.dataset.toggle);
      if (panel) panel.hidden = !panel.hidden;
    }
  });

  $('drawer').addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { closeDrawer(); return; }
    const product = e.target.closest('[data-product]');
    if (product) { openProduct(product.dataset.product); return; }
    const company = e.target.closest('[data-company]');
    if (company) { openCompany(company.dataset.company); return; }
  });

  $('mask').addEventListener('click', () => closeDrawer());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);

  renderMeta();
  renderTabs();
  selectTab(1);
  route();
})();
</script>
</body>
</html>
